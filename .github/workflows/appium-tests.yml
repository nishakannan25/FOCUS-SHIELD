name: 🛡️ FOCUS-SHIELD – Android E2E Appium Suite

# ────────────────────────────────────────────────────────────────────────────
# Trigger: every push to any branch + PRs to main + manual dispatch
# ────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode: mock | collect"
        required: false
        default: "mock"

# Cancel redundant in-progress runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1 – Collect & validate all test cases (dry-run, no device needed)
  # ──────────────────────────────────────────────────────────────────────────
  collect-tests:
    name: "🔍 Collect & Validate 314 Test Cases"
    runs-on: ubuntu-latest
    outputs:
      test_count: ${{ steps.count.outputs.count }}

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: "📦 Install test collection dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install \
            "pytest>=8.0.0" \
            "Appium-Python-Client>=4.0.0" \
            "openpyxl>=3.1.0" \
            "pandas>=2.0.0" \
            "requests>=2.31.0" \
            "python-dotenv>=1.0.0" \
            "Pillow>=10.0.0"

      - name: "🧹 Collect all test cases (no driver initialised)"
        id: count
        run: |
          set -euo pipefail

          echo "::group::pytest --collect-only output"
          # Mock the Appium driver so import doesn't fail on collection
          python - <<'PYEOF'
          import sys, types

          # ── Stub appium package ──────────────────────────────────────────────
          appium_pkg = types.ModuleType("appium")
          appium_webdriver = types.ModuleType("appium.webdriver")
          appium_common   = types.ModuleType("appium.webdriver.common")
          appiumby_mod    = types.ModuleType("appium.webdriver.common.appiumby")

          class AppiumBy:
              XPATH        = "xpath"
              CLASS_NAME   = "class name"
              ID           = "id"
              ACCESSIBILITY_ID = "accessibility id"

          appiumby_mod.AppiumBy = AppiumBy
          appium_webdriver.Remote = object
          appium_options_android = types.ModuleType("appium.options.android")

          class UiAutomator2Options:
              def __init__(self): pass
              def __setattr__(self, k, v): object.__setattr__(self, k, v)

          appium_options_android.UiAutomator2Options = UiAutomator2Options

          for mod_name, mod_obj in [
              ("appium",                              appium_pkg),
              ("appium.webdriver",                    appium_webdriver),
              ("appium.webdriver.common",             appium_common),
              ("appium.webdriver.common.appiumby",    appiumby_mod),
              ("appium.options",                      types.ModuleType("appium.options")),
              ("appium.options.android",              appium_options_android),
          ]:
              sys.modules[mod_name] = mod_obj

          # ── Stub selenium ────────────────────────────────────────────────────
          for mod_name in [
              "selenium",
              "selenium.webdriver",
              "selenium.webdriver.support",
              "selenium.webdriver.support.ui",
              "selenium.webdriver.support.expected_conditions",
              "selenium.webdriver.common",
              "selenium.webdriver.common.by",
          ]:
              sys.modules[mod_name] = types.ModuleType(mod_name)

          class WebDriverWait:
              def __init__(self, driver, timeout): pass
              def until(self, cond): return None

          class EC:
              @staticmethod
              def presence_of_element_located(x): return None
              @staticmethod
              def element_to_be_clickable(x): return None
              @staticmethod
              def visibility_of_element_located(x): return None

          sys.modules["selenium.webdriver.support.ui"].WebDriverWait = WebDriverWait
          sys.modules["selenium.webdriver.support.expected_conditions"] = EC

          import subprocess, json, re
          result = subprocess.run(
              ["python", "-m", "pytest", "--collect-only", "-q", "appium_tests/",
               "--ignore=appium_tests/generate_report.py",
               "--ignore=appium_tests/run_tests.py",
               "--ignore=appium_tests/conftest.py"],
              capture_output=True, text=True
          )
          output = result.stdout + result.stderr
          print(output)

          # Extract count from "X tests collected" line
          m = re.search(r'(\d+)\s+tests?\s+collected', output)
          count = int(m.group(1)) if m else 0
          print(f"DETECTED_COUNT={count}")
          with open(os.environ.get("GITHUB_OUTPUT", "/dev/null"), "a") as f:
              f.write(f"count={count}\n")
          PYEOF
          echo "::endgroup::"

          # Fallback: count directly with grep
          GREP_COUNT=$(grep -r "def test_" appium_tests/ --include="*.py" | wc -l || true)
          echo "count=${GREP_COUNT}" >> "$GITHUB_OUTPUT"
          echo "✅  Test functions detected via grep: ${GREP_COUNT}"

      - name: "📊 Validate test count meets 314 threshold"
        run: |
          COUNT=$(grep -r "def test_" appium_tests/ --include="*.py" | wc -l)
          echo "Total test functions: ${COUNT}"
          if [ "${COUNT}" -lt 300 ]; then
            echo "::error::Test count ${COUNT} is below the minimum threshold of 300!"
            exit 1
          fi
          echo "✅ Test count validation passed: ${COUNT} ≥ 300"

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2 – Mock execution + Excel report generation + Summary
  # ──────────────────────────────────────────────────────────────────────────
  generate-report:
    name: "📈 Generate Excel Report & GitHub Summary"
    runs-on: ubuntu-latest
    needs: collect-tests

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: "📦 Install report dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install \
            "openpyxl>=3.1.0" \
            "pandas>=2.0.0" \
            "requests>=2.31.0" \
            "Pillow>=10.0.0"

      - name: "📊 Generate Excel Analysis Report"
        run: |
          mkdir -p reports
          python appium_tests/generate_report.py \
            --mock \
            --output reports/appium_test_analysis.xlsx
          echo "✅ Excel report generated successfully"
          ls -lh reports/

      - name: "📁 Upload Excel report as build artifact"
        uses: actions/upload-artifact@v4
        with:
          name: appium-test-analysis-${{ github.run_number }}
          path: |
            reports/appium_test_analysis.xlsx
            appium_tests/reports/
          retention-days: 30
          if-no-files-found: warn

      - name: "📝 Write beautiful GitHub Step Summary"
        if: always()
        run: |
          RUN_DATE=$(date '+%A, %d %B %Y  %H:%M:%S UTC')
          COMMIT_SHORT="${GITHUB_SHA:0:7}"
          BRANCH="${GITHUB_REF_NAME}"

          cat >> "$GITHUB_STEP_SUMMARY" << 'MARKDOWN'
          # 🛡️ FOCUS-SHIELD — Appium E2E Test Suite Report

          MARKDOWN

          cat >> "$GITHUB_STEP_SUMMARY" << MARKDOWN
          > **Run #${{ github.run_number }}** | Branch: \`${BRANCH}\` | Commit: \`${COMMIT_SHORT}\` | ${RUN_DATE}
          > Backend: <https://focus-shield-three.vercel.app> | Runner: \`ubuntu-latest\`

