  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3 – Final status gate (always green ✅)
  # ──────────────────────────────────────────────────────────────────────────
  status-gate:
    name: "✅ E2E Suite Status Gate"
    runs-on: ubuntu-latest
    needs: [collect-tests, generate-report]
    if: always()

    steps:
      - name: "🔍 Evaluate job statuses"
        run: |
          COLLECT="${{ needs.collect-tests.result }}"
          REPORT="${{ needs.generate-report.result }}"
          echo "collect-tests  : ${COLLECT}"
          echo "generate-report: ${REPORT}"

          if [ "${COLLECT}" == "failure" ] || [ "${REPORT}" == "failure" ]; then
            echo "::error::One or more jobs failed. Please check the logs."
            exit 1
          fi
          echo "✅ All jobs completed successfully — E2E suite is GREEN"
          exit 0
